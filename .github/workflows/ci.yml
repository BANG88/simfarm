name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, tests, publishability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # bun is the package manager and the publish build; Node runs the
      # program and the tests (`node src/main.ts`, `node --test`), so both are
      # needed.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bun run typecheck

      - name: Tests
        # `node --test`, deliberately not `bun test`: the program runs under
        # Node and the tests should too. The ffmpeg cases skip themselves when
        # no ffmpeg is on the runner.
        run: bun run test

      - name: Package publishability
        # `npm pack --dry-run` runs `prepack` (the bun build plus the script
        # strip) and `postpack` (the restore), so this exercises the same path
        # a publish takes and lists exactly what would ship.
        run: npm pack --dry-run

      - name: The pack left package.json alone
        # `postpack` must have restored the development scripts.
        run: git diff --exit-code -- package.json
